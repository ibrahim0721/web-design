<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .metin {
            color: blue;
            background-color: rgb(179, 20, 20);
            text-align: center;
            font-weight: bold;
            font-family: Arial, sans-serif;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: underline;
            word-spacing: 5px;
        }
    </style>
</head>
<body>
    <!--
    1-color        renk içn
2-background-color  arka pılan rengi
3-text-align       yaıyı orta hizala
4-font-weight     yazının kalınlığı
5-font-family     yazının fontu
6-font-style       yazının stili
7-text-decoration   yazının altını çizme
8-text-transform   yazının büyük küçük harf
9-letter-spacing   harfler arası boşluk
10-word-spacing    kelimeler arası boşluk
    -->
<p class="metin">başarı bedel gerktirir</p>
</body>
</html>
