<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listeler</title>
<style>
   .a{list-style-type: square;} 
        
    
    ol{
        list-style-type: upper-roman;
    }
    </style>
</head>
<body>
    <ul class="a">
        <li>Öğe 1</li>
        <li>Öğe 2</li>
        <li>Öğe 3</li>
    </ul>
    
    <br>
    <ol>
        <li>Öğe 1</li>
        <li>Öğe 2</li>
        <li>Öğe 3</li>
    </ol>
</body>
</html>
