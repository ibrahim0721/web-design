<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin kulanımı</title>
    <style>
        .kutu {
            background-color: lightblue;
            width: 300px;
            height: 100px;
            margin-top: 20px;
          margin-left: 20px;
          margin-right: 20px;
          margin-bottom: 20px;
        }
        /*
        top= üst kenar boşluğu
        right= sağ kenar boşluğu
        bottom= alt kenar boşluğu
        left= sol kenar boşluğu
        */
    </style>
</head>
<body>
    <h4>margin özelliği ile kutuların dış kenar boşluklarını ayarlayabilirsiniz. Örneğin, yukarıdaki örnekte kutunun tüm kenarlarında 20px'lik bir boşluk bırakılmıştır.</h4>
    <div class="kutu"></div>
    <p style="margin-top: 40px;">
    iletişim sayfası
  </p>
  <p style="margin-top: 40px; margin-left: 40px;">
    ccs dersleri
  </p>

  
</body>
</html>
