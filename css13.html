<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* link ilk tıklanılmamış link
            hover link üzerine gelindiğinde
            active link tıklanıldığında
            visited link tıklanmış link
            */
        a:link{
            color: red;
            
            text-decoration: none;
        }
        a:hover{
            color: blue;
            text-decoration: underline;
        }
        a:active{
            color: yellow;
            background-color: black;
        }
        a:visited{
            color: green;
        }
    </style>
</head>
<body>
    <a href="http://www.google.com.tr">Google</a>
</body>
</html>
