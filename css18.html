<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dikey menü yapımı ()verical</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
<style> ul{
    list-style-type:none;
    
    width: 20%;
} 
ul li{
    padding: 15px;
    background-color: rgb(65, 64, 64);
    margin-left: -30px;
}
ul li:hover{
    background-color: rgb(255, 0, 0);
    transition: 0.5s;
    
}
ul li a{
    text-decoration: none;
    color: rgb(255, 255, 255);
    font-family:arial,helvetica,sans-serif;
    font-weight: bold;
}
ul li:nth-child(1){
    background-color: rgb(0, 255, 60);
}
i{
    padding-right: 10px;
    color: rgb(255, 255, 255);
}
</style>
</head>
<body>
    <ul>
        <li> <a href="#"><i class="fa-solid fa-house"></i>home</a></li>
        <li> <a href="#"><i class="fa-regular fa-newspaper"></i>news</a></li>
        <li> <a href="#"><i class="fa-solid fa-address-card"></i>contact</a></li>
        <li> <a href="#"><i class="fa-solid fa-info"></i>about</a></li>
    </ul>
    
</body>
</html>
