    <form action="/iletisim" method="post">
<p>
<label for="ad">Ad Soyad</label>
<input type="text" id="ad" name="ad" required
minlength="3" maxlength="40">
</p>

</p>
<p>

</p>
<p>
<label for="kodu">Kod (örn. Aaaaa11)</label>
<input type="text" id="kodu" name="kodu"
pattern="[A-Z][a-z]{4}[0-9]{2}" required
title="Bir büyük harf , ardından 4 küçük harf ve 2 rakamdan oluşan bir kod giriniz.">
</p>
