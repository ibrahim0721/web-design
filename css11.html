<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>selector -seçiciler</title>
    <style>
        /* *{(bu her şeyi etkiler)
            color: red;
        } */
         /* p{
            color: red;

         /* p,a,h1,h2,h3,h4,h5,h6{

            /* div p{(bu divdeki tüm elementleri etkiler)

             /* div>p{(bu divdeki anesi div elementleri etkiler)

</head>
<body>
    <div>
        
           <p>paragraf1</p>
           <p>paragraf2</p>

    </div>

            <li>liste1</li>
            <li>liste2</li>

    </div>
    <div>
        <h1> başlık1</h1>

    <h2>h2 başlık2</h2>
    <h3>h3 başlık3</h3>

    
</body>
</html>
