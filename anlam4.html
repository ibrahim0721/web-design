<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Sayfa Düzeni</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 1rem;
            background-color: #f4f6f8;
        }

        /* CSS Grid Kapsayıcısı ve Haritası */
        .sayfa {
            display: grid;
            grid-template-areas:
                "baslik baslik"
                "kenar  icerik"
                "altlik altlik";
            grid-template-columns: 200px 1fr;
            gap: 1rem;
        }

        /* Alan Eşleştirmeleri */
        header { grid-area: baslik; }
        aside  { grid-area: kenar;  }
        main   { grid-area: icerik; }
        footer { grid-area: altlik; } 

        /* Görsellik İçin Eklenen Stiller */
        header, aside, main, footer {
            padding: 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }

        header { background-color: #2c3e50; text-align: center; }
        aside  { background-color: #34495e; min-height: 300px; }
        main   { background-color: #3498db; min-height: 300px; }
        footer { background-color: #7f8c8d; text-align: center; }
    </style>
</head>
<body>

    <div class="sayfa">
        <header>Üst Başlık (Header)</header>
        <aside>Sol Menü (Sidebar)</aside>
        <main>Ana İçerik Alanı (Main)</main>
        <footer>Alt Bilgi (Footer)</footer>
    </div>

</body>
</html>
