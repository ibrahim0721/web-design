    <!-- Düzeltildi: table etiketi ve niteliği ayrıldı -->

        <caption>Haftalık ders programı</caption>
        <thead>
            <tr>
                <th scope="col">Saat</th>
                <th scope="col">Pazartesi</th>
                <th scope="col">Salı</th>
                <th scope="col">Çarşamba</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">09:00</th>
                <!-- 2 satır birleştirme -->
                <td rowspan="2">Web Tasarım</td>
                <td>Matematik</td>
                <!-- 2 satır birleştirme -->
                <td rowspan="2">Veri Tabanı Lab</td>
            </tr>
            <tr>
                <th scope="row">10:00</th>
                <td>Fizik</td>
            </tr>
            <tr>
                <th scope="row">12:00</th>
                <!-- 3 sütun birleştirme -->
                <td colspan="3">Öğle arası</td>
            </tr>
            <tr>
                <th scope="row">13:00</th>
                <td>İngilizce</td>

            </tr>
        </tbody>
