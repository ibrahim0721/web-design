<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding kulanımı</title>
    <style>
    .kutu{
        background-color: lightblue;
        width: 250px;
        height: 250px;
       
    }
    .h3{
        padding-left: 50px;
        padding-top: 50px;
    }
    .p{
        padding-left: 5px;
        padding-top: 25px;
        padding-right: 5px;
        color: #fff;
        text-align: right;
    }
    </style>
</head>
<body>
    <!--padding kulanımı-->
<div class="kutu">
    <h3 class="h3">
      ibrahim bayındır 
    </h3>
     <p >wep sistemine hoş geldin</p>
<p class="p"> telif hakkı saklıdır</p>
    </div>
</body>
</html>
