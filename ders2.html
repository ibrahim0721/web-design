<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- initial-scale düzeltildi -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Kişisel Tanıtım Sayfası</title>
</head>
<body>

    <!-- İçerik anlamsal etiketler içine alındı -->
    <header>
        <h1>Merhaba, ben Ahmet</h1>
        <p>Yazılım Mühendisliği öğrencisiyim.</p>
    </header>

    <main>
        <form action="/iletisim" method="post">
            <div>
                <label for="ad">Ad Soyad</label>
                <input type="text" id="ad" name="ad" required minlength="3" maxlength="40">
            </div>

            <div>
                <label for="eposta">E-posta</label>
                <input type="email" id="eposta" name="eposta" required>
            </div>

            <div>
                <label for="yas">Yaş</label>
                <input type="number" id="yas" name="yas" min="17" max="80">
            </div>

            <div>
                <label for="kodu">Kod (örn. A1234)</label>
                <input type="text" id="kodu" name="kodu" pattern="[A-Z][0-9]{4}" required title="Bir büyük harf ve ardından 4 rakam">
            </div>

            <div>
                <label>
                    <input type="checkbox" name="onay" required>
                    KVKK metnini okudum, onaylıyorum
                </label>
            </div>

            <div>
                <button type="submit">Gönder</button>
            </div> 
            okudum anlamaya  çılışıyorum karıuşık bir durum olabilir am
            <label for="konu">Mesajınızın konusu</label>
<select id="konu" name="konu">
<optgroup label="Ders">
<option value="odev">Ödev hakkında</option>
<option value="sinav">Sınav hakkında</option>
</optgroup>
</select>
<label for="mesaj">Mesajınız</label>
<textarea id="mesaj" name="mesaj" rows="6"></textarea>
<button type="submit">Gönder</button>
<button type="button">Taslağı temizle</button>
        </form>
    </main>

</body>
</html>
